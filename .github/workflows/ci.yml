name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install bash tmux
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned chezmoi
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat home/.chezmoiversion)"
          install_dir="$RUNNER_TEMP/chezmoi-bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- \
            -b "$install_dir" -t "v${version}"
          "$install_dir/chezmoi" --version | grep -F "chezmoi version v${version}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Test complete Unix sync
        shell: pwsh
        run: |
          ./.github/scripts/test-sync.ps1 -ScratchHome (Join-Path $env:RUNNER_TEMP "home")

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned chezmoi
        shell: pwsh
        run: |
          $version = (Get-Content home/.chezmoiversion -Raw).Trim()
          choco install chezmoi --version=$version -y --no-progress
          if (-not ((chezmoi --version) -match "chezmoi version v$([regex]::Escape($version))")) {
            throw "Unexpected chezmoi version"
          }

      - name: Test complete Windows sync
        shell: pwsh
        run: |
          ./.github/scripts/test-sync.ps1 -ScratchHome (Join-Path $env:RUNNER_TEMP "home")

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate scripts and JSON lockfiles
        run: |
          set -euo pipefail
          bash -n sync
          shellcheck sync
          pwsh -NoProfile -Command '$failed = $false; "sync.ps1", ".github/scripts/test-sync.ps1" | ForEach-Object { $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $failed = $true; $errors | ForEach-Object { Write-Error $_ } } }; if ($failed) { exit 1 }'
          find home/dot_local/share/lazyvim tests -name '*.lua' -print0 | xargs -0 -n1 luac -p
          version="$(cat home/.chezmoiversion)"
          grep -F -- "-t v${version}" README.md
          grep -F -- "--version ${version}" README.md
          python3 -m json.tool home/dot_config/nvim/lazy-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/mason-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/lazyvim.json > /dev/null
