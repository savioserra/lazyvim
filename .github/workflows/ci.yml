name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned chezmoi
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat home/.chezmoiversion)"
          install_dir="$RUNNER_TEMP/chezmoi-bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- \
            -b "$install_dir" -t "v${version}"
          "$install_dir/chezmoi" --version | grep -F "chezmoi version v${version}"
          echo "CHEZMOI=$install_dir/chezmoi" >> "$GITHUB_ENV"

      - name: Apply into a scratch HOME
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/home"
          mkdir -p "$scratch"
          HOME="$scratch" \
            XDG_CONFIG_HOME="$scratch/.config" \
            XDG_DATA_HOME="$scratch/.local/share" \
            XDG_STATE_HOME="$scratch/.local/state" \
            XDG_CACHE_HOME="$scratch/.cache" \
            "$CHEZMOI" apply \
              --source "$GITHUB_WORKSPACE/home" \
              --destination "$scratch" \
              --force -v

      - name: Confirm pinned tools landed at the right versions
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/home"
          "$scratch/.local/bin/nvim" --version | head -1
          "$scratch/.local/bin/go" version
          "$scratch/.local/bin/rg" --version | head -1
          "$scratch/.local/bin/fd" --version
          "$scratch/.local/bin/fzf" --version
          "$scratch/.local/bin/lazygit" --version | head -1
          "$scratch/.local/bin/tree-sitter" --version

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned chezmoi
        shell: pwsh
        run: |
          $version = (Get-Content home/.chezmoiversion -Raw).Trim()
          choco install chezmoi --version=$version -y --no-progress
          if (-not ((chezmoi --version) -match "chezmoi version v$([regex]::Escape($version))")) {
            throw "Unexpected chezmoi version"
          }

      - name: Apply into a scratch HOME
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $env:HOME = $scratch
          $env:USERPROFILE = $scratch
          $env:LOCALAPPDATA = Join-Path $scratch "AppData/Local"
          chezmoi apply `
            --source (Join-Path $env:GITHUB_WORKSPACE "home") `
            --destination $scratch `
            --force -v

      - name: Confirm pinned tools landed at the right versions
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "home"
          & "$scratch\.local\opt\nvim\bin\nvim.exe" --version | Select-Object -First 1
          & "$scratch\.local\opt\go\bin\go.exe" version
          & "$scratch\.local\opt\nvm-windows\nvm.exe" version
          & "$scratch\.local\opt\nvm-windows\nodejs\node.exe" --version
          & "$scratch\.local\bin\rg.exe" --version | Select-Object -First 1
          & "$scratch\.local\bin\fd.exe" --version
          & "$scratch\.local\bin\fzf.exe" --version
          & "$scratch\.local\bin\lazygit.exe" --version | Select-Object -First 1
          & "$scratch\.local\bin\tree-sitter.exe" --version

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate scripts and JSON lockfiles
        run: |
          set -euo pipefail
          bash -n sync
          shellcheck sync
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./sync.ps1), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          version="$(cat home/.chezmoiversion)"
          grep -F -- "-t v${version}" README.md
          grep -F -- "--version ${version}" README.md
          python3 -m json.tool home/dot_config/nvim/lazy-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/mason-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/lazyvim.json > /dev/null
