name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # CI-only unmanaged prerequisites, never workstation lifecycle installers.
      # Runner images supply Git, curl, archive/hash tools and build tools.
      - name: Prepare unmanaged tmux and Bash prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
            command -v shellcheck # runner-provided; no unpinned lint downloads
            command -v fc-cache
          else
            test "$(uname -m)" = arm64
            brew install bash tmux
          fi

      - name: Bootstrap and validate isolated engine lifecycle
        shell: bash
        run: |
          set -euo pipefail
          # Outside runner HOME/source; retained for inspection, never rm caller input.
          scratch_parent="$(mktemp -d /tmp/workstation-ci.XXXXXX)"
          ./.github/scripts/test-apply.sh "$scratch_parent/home"
