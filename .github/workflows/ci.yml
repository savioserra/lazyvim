name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)"

      - name: Apply into a scratch HOME
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/home"
          mkdir -p "$scratch"
          "$HOME/bin/chezmoi" apply --source home --destination "$scratch" --force -v

      - name: Confirm pinned tools landed at the right versions
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/home"
          "$scratch/.local/bin/nvim" --version | head -1
          "$scratch/.local/bin/rg" --version | head -1
          "$scratch/.local/bin/fd" --version
          "$scratch/.local/bin/fzf" --version
          "$scratch/.local/bin/lazygit" --version | head -1
          "$scratch/.local/bin/tree-sitter" --version

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install chezmoi
        run: choco install chezmoi -y --no-progress

      - name: Apply into a scratch HOME
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          chezmoi apply --source home --destination $scratch --force -v

      - name: Confirm pinned tools landed at the right versions
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "home"
          & "$scratch\.local\opt\nvim\bin\nvim.exe" --version | Select-Object -First 1
          & "$scratch\.local\bin\rg.exe" --version | Select-Object -First 1
          & "$scratch\.local\bin\fd.exe" --version
          & "$scratch\.local\bin\fzf.exe" --version
          & "$scratch\.local\bin\lazygit.exe" --version | Select-Object -First 1
          & "$scratch\.local\bin\tree-sitter.exe" --version

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate JSON lockfiles
        run: |
          set -euo pipefail
          python3 -m json.tool home/dot_config/nvim/lazy-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/mason-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/lazyvim.json > /dev/null
