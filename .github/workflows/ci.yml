name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer: ./scripts/install-linux
          - os: macos-15
            installer: ./scripts/install-macos
          - os: macos-15-intel
            installer: ./scripts/install-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools and link configuration
        run: ${{ matrix.installer }} --no-font --no-restore

      - name: Restore locked plugins
        run: ./scripts/restore --plugins-only

      - name: Validate configuration
        run: ./scripts/check

      - name: Ensure checks did not rewrite tracked files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools and link configuration
        run: ./scripts/install-windows.ps1 -NoFont -NoRestore

      - name: Restore locked plugins
        run: ./scripts/restore.ps1 -PluginsOnly

      - name: Validate configuration
        run: ./scripts/check.ps1

      - name: Ensure checks did not rewrite tracked files
        run: |
          git diff --exit-code
          $status = @(git status --porcelain)
          if ($status.Count -gt 0) {
            throw "Commands created uncommitted files: $($status -join ', ')"
          }
