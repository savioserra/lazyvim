name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Cross-compile supported hosts
        run: |
          mkdir -p .build/cross
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .build/cross/lazyvim-linux-amd64 ./cmd/lazyvim
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o .build/cross/lazyvim-darwin-arm64 ./cmd/lazyvim
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o .build/cross/lazyvim-darwin-amd64 ./cmd/lazyvim
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o .build/cross/lazyvim-windows-arm64.exe ./cmd/lazyvim
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o .build/cross/lazyvim-windows-amd64.exe ./cmd/lazyvim

  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install tmux test dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes tmux
          else
            brew install bash tmux
          fi

      - name: Run native Go tests and build CLI
        run: |
          go test ./...
          mkdir -p .build
          go build -trimpath -o .build/lazyvim ./cmd/lazyvim

      - name: Install pinned tools and configuration
        run: .build/lazyvim install --no-font --no-restore

      - name: Restore locked environment
        run: .build/lazyvim restore

      - name: Validate configuration
        run: .build/lazyvim check

      - name: Ensure checks did not rewrite tracked files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run native Go tests and build CLI
        run: |
          go test ./...
          New-Item -ItemType Directory -Force .build | Out-Null
          go build -trimpath -o .build/lazyvim.exe ./cmd/lazyvim

      - name: Install pinned tools and configuration
        run: ./.build/lazyvim.exe install --no-font --no-restore

      - name: Restore locked environment
        run: ./.build/lazyvim.exe restore

      - name: Validate configuration
        run: ./.build/lazyvim.exe check

      - name: Ensure checks did not rewrite tracked files
        run: |
          git diff --exit-code
          $status = @(git status --porcelain)
          if ($status.Count -gt 0) {
            throw "Commands created uncommitted files: $($status -join ', ')"
          }
