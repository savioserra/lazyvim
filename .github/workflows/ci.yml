name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install bash tmux
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned chezmoi
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat home/.chezmoiversion)"
          install_dir="$RUNNER_TEMP/chezmoi-bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- \
            -b "$install_dir" -t "v${version}"
          "$install_dir/chezmoi" --version | grep -F "chezmoi version v${version}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Test complete Unix apply
        shell: pwsh
        run: |
          ./.github/scripts/test-apply.ps1 -ScratchHome (Join-Path $env:RUNNER_TEMP "home")

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned chezmoi
        shell: pwsh
        run: |
          $version = (Get-Content home/.chezmoiversion -Raw).Trim()
          choco install chezmoi --version=$version -y --no-progress
          if (-not ((chezmoi --version) -match "chezmoi version v$([regex]::Escape($version))")) {
            throw "Unexpected chezmoi version"
          }

      - name: Test complete Windows apply
        shell: pwsh
        run: |
          ./.github/scripts/test-apply.ps1 -ScratchHome (Join-Path $env:RUNNER_TEMP "home")

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install LuaJIT syntax checker
        run: sudo apt-get update && sudo apt-get install -y luajit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: home/dot_node-version
      - name: Validate scripts and JSON lockfiles
        run: |
          set -euo pipefail
          sh -n home/.chezmoiscripts/run_after_20-unix-apply.sh.tmpl
          sh -n home/dot_local/bin/executable_workstation-tmux-subagents
          shellcheck -s sh home/.chezmoiscripts/run_after_20-unix-apply.sh.tmpl home/dot_local/bin/executable_workstation-tmux-subagents
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".github/scripts/test-apply.ps1"), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          while IFS= read -r -d '' file; do LUA_AUDIT_FILE="$file" luajit -e 'assert(loadfile(os.getenv("LUA_AUDIT_FILE")))'; done < <(find home tests -name '*.lua' -print0)
          version="$(cat home/.chezmoiversion)"
          grep -F -- "-t v${version}" README.md
          grep -F -- "--version ${version}" README.md
          python3 -m json.tool home/dot_config/nvim/lazy-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/mason-lock.json > /dev/null
          python3 -m json.tool home/dot_config/nvim/lazyvim.json > /dev/null
          python3 -m json.tool home/dot_local/share/workstation/versions.json > /dev/null
          python3 -m json.tool home/dot_pi/agent/extensions/tmux-subagents/config.json > /dev/null
          python3 -m json.tool .luarc.json > /dev/null
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix home/dot_pi/agent/extensions/tmux-subagents
          find tests/tmux-subagents -name '*.test.ts' -print0 | xargs -0 node --test
