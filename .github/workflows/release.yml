name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/savioserra/lazyvim/internal/buildinfo.version=${version}"

          build_unix() {
            local goos="$1" goarch="$2" platform="$3"
            local name="lazyvim_${platform}_${goarch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "dist/${name}/lazyvim" ./cmd/lazyvim
            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" lazyvim
            rm -rf "dist/${name}"
          }

          build_windows() {
            local goarch="$1"
            local name="lazyvim_Windows_${goarch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS=windows GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "dist/${name}/lazyvim.exe" ./cmd/lazyvim
            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" lazyvim.exe
            rm -rf "dist/${name}"
          }

          build_unix linux amd64 Linux
          build_unix darwin amd64 Darwin
          build_unix darwin arm64 Darwin
          build_windows amd64
          build_windows arm64
          (cd dist && sha256sum lazyvim_* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
