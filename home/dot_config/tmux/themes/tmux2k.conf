# tmux2k's built-in "catppuccin" preset is hardcoded to Catppuccin's own hex
# values; keep only the layout/behavior it provides and override every color
# variable it actually renders through with tender.vim's own dark palette
# (https://github.com/jacoborus/tender.vim) so tmux matches Neovim exactly.
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-show-powerline true
set -g @tmux2k-icons-only false

# Round powerline glyphs (Nerd Font PUA U+E0B6/U+E0B4), matching Neovim's
# own rounded float/window borders (vim.opt.winborder = "rounded").
set -g @tmux2k-left-sep ''
set -g @tmux2k-right-sep ''

# Neovim's lualine already shows branch + live diff in real time; drop the
# redundant, 15s-polled git segment here and let it own that instead.
set -g @tmux2k-left-plugins 'session cwd'
set -g @tmux2k-right-plugins 'time'
set -g @tmux2k-refresh-rate 15
set -g @tmux2k-time-format '%a %H:%M'

# tender.vim palette (colors/tender.vim): background #282828, foreground
# #eeeeee, status-line gray #666666. Dark, low-luminance background means
# segment text wants to stay dark too (matches tender's own bg, ~8-9:1
# contrast against every accent below); "white" is only for text against the
# lighter mid-gray chrome tone, where it needs to flip light again.
set -g @tmux2k-black '#282828'       # tender background
set -g @tmux2k-text '#282828'        # tender background (text drawn on colored segments)
set -g @tmux2k-white '#eeeeee'       # tender foreground (ink on the mid-gray "gray" chrome)
set -g @tmux2k-gray '#666666'        # tender's own documented status-line color
set -g @tmux2k-pane-border '#666666' # explicit, matches @tmux2k-gray
set -g @tmux2k-blue '#73cef4'        # tender statement/keyword (cwd segment, ~8.3:1)
set -g @tmux2k-green '#c9d05c'       # tender conditional/diff-added (session segment, ~8.9:1)
set -g @tmux2k-yellow '#ffc24b'      # tender number/boolean -- sets tmux2k's "orange" slot (time segment, ~9.2:1)
set -g @tmux2k-time-colors 'orange text'
set -gu @tmux2k-cpu-colors
set -gu @tmux2k-cpu-gradient
set -gu @tmux2k-cpu-icon-link-to
set -gu @tmux2k-ram-colors
set -gu @tmux2k-ram-gradient
set -gu @tmux2k-ram-icon
set -gu @tmux2k-ram-icon-link-to

# Center compact window pills and retain activity flags.
set -g @tmux2k-window-list-alignment 'absolute-centre'
set -g @tmux2k-window-list-format '#I:#W'
set -g @tmux2k-window-list-compact true
set -g @tmux2k-window-list-flags true

# Status segments remain clickable when their companion popup tool is installed.
set -g @tmux2k-enable-popups true
set -g @tmux2k-popup-width '85%'
set -g @tmux2k-popup-height '85%'
