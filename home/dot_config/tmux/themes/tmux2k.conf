# tmux2k provides the status bar layout and a built-in Catppuccin palette.
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-show-powerline true
set -g @tmux2k-icons-only false

# Keep project context on the left and host telemetry on the right.
set -g @tmux2k-left-plugins 'session git cwd'
set -g @tmux2k-right-plugins 'cpu ram uptime time'
set -g @tmux2k-refresh-rate 5
set -g @tmux2k-time-format '%a %H:%M'

# Color CPU and memory utilization using the matching palette.
set -g @tmux2k-cpu-gradient 'catppuccin'
set -g @tmux2k-cpu-icon-link-to 'usage'
set -g @tmux2k-ram-gradient 'catppuccin'
set -g @tmux2k-ram-icon-link-to 'usage'

# Center compact window pills and retain activity flags.
set -g @tmux2k-window-list-alignment 'absolute-centre'
set -g @tmux2k-window-list-format '#I:#W'
set -g @tmux2k-window-list-compact true
set -g @tmux2k-window-list-flags true

# Status segments remain clickable when their companion popup tool is installed.
set -g @tmux2k-enable-popups true
set -g @tmux2k-popup-width '85%'
set -g @tmux2k-popup-height '85%'
