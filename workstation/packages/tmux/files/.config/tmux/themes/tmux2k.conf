# tmux2k renders every color variable straight into tmux style strings, so
# tmux NAMED colors work anywhere hex would: the bar resolves through the
# live terminal palette instead of hardcoding one theme's hex values. When
# the terminal palette changes (e.g. Omarchy retints panes via OSC 4 on
# theme switch), the bar restyles itself without any tmux reload.
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-show-powerline true
set -g @tmux2k-icons-only false

# Crisp vertical separators: use plain line segments instead of rounded/cut powerline arrows.
set -g @tmux2k-left-sep '|'
set -g @tmux2k-right-sep '|'
set -g @tmux2k-window-list-left-sep '|'
set -g @tmux2k-window-list-right-sep '|'


# Neovim's lualine already shows branch + live diff in real time; drop the
# redundant git segment here and let it own that instead. Refresh at 5s so
# the clock and cwd stay responsive.
set -g @tmux2k-left-plugins 'session cwd'
set -g @tmux2k-right-plugins 'time'
set -g @tmux2k-refresh-rate 5
set -g @tmux2k-time-format '%a %H:%M'

# Palette roles map to terminal palette slots so the bar follows the active
# terminal/tmux theme everywhere (Omarchy, kitty, Ghostty, iTerm...):
#   default      -> terminal background/foreground (transparent bar)
#   blue/green/yellow -> accent pills (session/cwd/time), theme-tinted
#   black        -> text drawn on accent pills (contrast via color0)
#   brightblack  -> muted chrome: inactive windows, pane borders
set -g @tmux2k-black 'black'
set -g @tmux2k-text 'black'
set -g @tmux2k-white 'brightblack'
set -g @tmux2k-gray 'brightblack'
set -g @tmux2k-blue 'blue'
set -g @tmux2k-green 'green'
set -g @tmux2k-yellow 'yellow'
set -g @tmux2k-time-colors 'orange text'
set -g @tmux2k-red 'red'
set -g @tmux2k-light-green 'brightgreen'
set -g @tmux2k-bg-main 'default'
set -g @tmux2k-bg-alt 'default'
set -g @tmux2k-pane-border 'brightblack'
set -g @tmux2k-pane-active-border 'blue'
# Window-list colors are SLOT names resolved through shell indirection,
# not literal colors: the active pill renders bg=<slot0> with <slot1> as
# its accent, so bg_main (default) keeps the pill on the transparent bar.
set -g @tmux2k-window-list-colors 'bg_main blue'
set -gu @tmux2k-cpu-colors
set -gu @tmux2k-cpu-gradient
set -gu @tmux2k-cpu-icon-link-to
set -gu @tmux2k-ram-colors
set -gu @tmux2k-ram-gradient
set -gu @tmux2k-ram-icon
set -gu @tmux2k-ram-icon-link-to

# Center compact window pills and retain activity flags: active window gets
# the blue pill, inactive windows render as plain muted text on the bar.
set -g @tmux2k-window-list-alignment 'absolute-centre'
set -g @tmux2k-window-list-format '#I:#W'
set -g @tmux2k-window-list-compact true
set -g @tmux2k-window-list-flags true

# Status segments remain clickable when their companion popup tool is installed.
set -g @tmux2k-enable-popups true
set -g @tmux2k-popup-width '85%'
set -g @tmux2k-popup-height '85%'
